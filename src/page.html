<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDL → ER-диаграмма</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; color: #172638; background: #f5f7fa; font: 14px system-ui, sans-serif; }
  header, .pane-title, .status { background: #fff; border-bottom: 1px solid #d4dce7; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; }
  h1 { margin: 0 auto 0 0; font-size: 18px; }
  button { font: inherit; font-weight: 600; border: 1px solid #b6c5d8; border-radius: 5px; padding: 7px 11px; background: #fff; color: #223e60; cursor: pointer; }
  #build { background: #24588f; color: #fff; border-color: #24588f; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid #376db0; outline-offset: -2px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 34%) minmax(0, 1fr); }
  section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor { border-right: 1px solid #d4dce7; }
  .pane-title { margin: 0; padding: 9px 13px; font-size: 13px; font-weight: 650; }
  textarea { flex: 1; width: 100%; min-height: 0; resize: none; padding: 13px; border: 0; color: inherit; background: #fff; font: 13px/1.6 ui-monospace, monospace; tab-size: 2; }
  #canvas { flex: 1; min-height: 0; overflow: auto; background-color: #f9fafc; background-image: linear-gradient(#e7ebf1 1px, transparent 1px), linear-gradient(90deg, #e7ebf1 1px, transparent 1px); background-size: 10px 10px; }
  #canvas svg { display: block; }
  .status { border-top: 1px solid #d4dce7; border-bottom: 0; padding: 8px 13px; }
  #notices { margin: 5px 0 0; padding-left: 20px; max-height: 7em; overflow: auto; color: #794411; }
  #notices:empty { display: none; }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(140px, 40%) minmax(140px, 1fr); }
    .editor { border-right: 0; border-bottom: 1px solid #d4dce7; }
    h1 { flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>DDL → ER-диаграмма</h1>
  <button type="button" id="build">Построить</button>
  <button type="button" id="download" disabled>Скачать .drawio</button>
</header>
<main>
  <section class="editor" aria-labelledby="sql-title">
    <label class="pane-title" id="sql-title" for="sql">PostgreSQL DDL</label>
    <textarea id="sql" spellcheck="false">CREATE TABLE customers (
  id bigint PRIMARY KEY,
  name text NOT NULL
);

CREATE TABLE orders (
  id bigint PRIMARY KEY,
  customer_id bigint NOT NULL REFERENCES customers (id),
  placed_at timestamptz NOT NULL
);</textarea>
  </section>
  <section aria-labelledby="diagram-title">
    <h2 class="pane-title" id="diagram-title">Предпросмотр</h2>
    <div id="canvas" tabindex="0" aria-label="Область диаграммы"></div>
  </section>
</main>
<div class="status" aria-live="polite">
  <div id="status"></div>
  <ul id="notices"></ul>
</div>
<!-- APP -->
</body>
</html>
